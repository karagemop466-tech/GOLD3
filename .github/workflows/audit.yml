name: Anti-hallucination checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate, build, audit and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 1. the data gate: refuses to pass if a value is unsourced or impossible
      - name: Verify the datasets (source domains, quotes, arithmetic)
        run: python3 scripts/verify.py

      # 2. build Dataset C subpages + unified static site; fails on broken internal links
      - name: Build the static site
        run: |
          python3 scripts/build_ext_pages.py
          python3 scripts/build_site.py

      # 3. the independent audit: provenance, weighted rows, stray numbers,
      #    and the requirement that every row appears in the verification log
      - name: Audit the dataset and the built pages
        run: python3 scripts/audit.py

      # 4. Dataset C melt arithmetic, allowlist, HTML link/anchor & XSS audit
      - name: Run Dataset C & repo-wide security/hallucination audit
        run: python3 scripts/run_security_audit.py --pass-label "GitHub Actions CI Audit"

      # 5. assert the built HTML actually contains the audited values
      - name: Render test against the built pages
        run: node scripts/render-test.js

      # 6. regenerate the human-readable verification report
      - name: Rebuild the verification report
        run: python3 scripts/report_verify.py

      # 7. verify every root HTML <tbody><tr> row carries an https:// official link
      - name: Enforce official https:// source link on every root HTML table row
        run: |
          node -e '
            const fs = require("fs");
            let total = 0, missing = 0;
            for (const f of fs.readdirSync(".").filter(x => x.endsWith(".html")).sort()) {
              const html = fs.readFileSync(f, "utf8");
              for (const tb of html.matchAll(/<tbody[^>]*>([\s\S]*?)<\/tbody>/gi)) {
                for (const tr of tb[1].matchAll(/<tr[^>]*>([\s\S]*?)<\/tr>/gi)) {
                  total++;
                  if (!/href=["\x27]https:\/\//i.test(tr[1])) missing++;
                }
              }
            }
            console.log(`Root HTML table rows: ${total}, missing https:// official links: ${missing}`);
            if (missing > 0) process.exit(1);
          '

      # 8. run session-cbea1001 standalone observatory anti-hallucination & link security suite
      - name: Run session-cbea1001 anti-hallucination & link security suite
        run: npm --prefix archive/session-cbea1001 test

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            reports/audit-report.md
            reports/verification-report.md
            VERIFICATION_REPORT.md

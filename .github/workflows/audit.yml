name: Anti-hallucination audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit data and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify every value against its source (data gate)
        run: python3 scripts/verify.py

      - name: Audit the dataset (fails on invented or unsourced values)
        run: python3 scripts/audit.py
      - name: Rebuild the site from the data
        run: python3 scripts/build_site.py

      - name: Committed pages must match a fresh build
        run: |
          if ! git diff --quiet; then
            echo "::error::The committed HTML does not match a fresh build from data/*.json."
            git diff --stat
            echo "Run 'python3 scripts/build_site.py' and commit the result."
            exit 1
          fi

      - name: Render the pages against the real data
        run: node scripts/render-test.js

      - name: Trace every page claim back to the data
        run: node scripts/page-check.js
      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: reports/audit-report.md

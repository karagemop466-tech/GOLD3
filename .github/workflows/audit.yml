name: Anti-hallucination audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit data and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit the dataset (fails on invented or unsourced values)
        run: python3 scripts/audit.py
      - name: Render the pages against the real data
        run: node scripts/render-test.js
      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: reports/audit-report.md
